<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>컴퓨터교육석사 논문검색</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>컴퓨터교육석사 논문검색</h1>
    <p class="desc">주제를 고르거나 직접 검색하면 논문 목록과 무료 원문(PDF) 링크를 바로 보여줍니다. 유료 논문은 출처 페이지로 연결됩니다.</p>

    <details class="keybox" id="keybox">
      <summary>OpenAlex API 키 설정 (처음 한 번만)</summary>
      <p>openalex.org에서 무료 계정을 만들고 openalex.org/settings/api의 키를 붙여넣으세요. 키는 이 브라우저에만 저장되고 GitHub에는 올라가지 않습니다.</p>
      <div class="keyrow">
        <input id="key" type="password" placeholder="API 키 붙여넣기" autocomplete="off" aria-label="API 키">
        <button type="button" class="btn primary" id="keysave">저장</button>
      </div>
    </details>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="search" role="tab">논문 검색</button>
      <button class="tab" data-tab="saved" role="tab">저장함 <span class="badge" id="b-saved">0편</span></button>
    </div>

    <section id="panel-search">
      <nav class="chips" id="chips" aria-label="주제 분류"></nav>
      <form id="form" class="toolbar">
        <input id="q" type="search" placeholder="검색어 (영어가 결과가 가장 많습니다)" aria-label="검색어">
        <select id="sort" aria-label="정렬">
          <option value="">관련도순</option>
          <option value="publication_date:desc">최신순</option>
          <option value="cited_by_count:desc">인용순</option>
        </select>
        <select id="year" aria-label="발행 시기">
          <option value="all">전체 기간</option>
          <option value="3">최근 3년</option>
          <option value="5">최근 5년</option>
          <option value="10">최근 10년</option>
        </select>
        <button class="btn primary" type="submit">검색</button>
        <label class="oa"><input type="checkbox" id="oa"> 무료 원문만</label>
      </form>
      <div id="ext" class="ext"></div>
      <p id="status" class="count"></p>
      <div id="cards"><div class="empty">위에서 주제를 고르거나 검색어를 입력해 보세요.</div></div>
    </section>

    <section id="panel-saved" hidden><div id="saved"></div></section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
